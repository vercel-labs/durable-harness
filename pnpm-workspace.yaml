packages:
  - packages/*
  - apps/*
allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@parcel/watcher': false
  '@swc/core': false
  cbor-extract: true
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  protobufjs: false
  tree-sitter-bash: false
  tree-sitter-powershell: false
  workerd: true
minimumReleaseAgeExclude:
  - '@workflow/*'
  - eve
  - libfx
  - '@earendil-works/*'
  - '@vercel/*'
  - '@ai-sdk/*'
  - ai
# Workflow SDK: the latest v5 npm release (workflow, @workflow/core and
# @workflow/world-vercel 5.2.3, @workflow/world-local 5.1.2, @workflow/world
# and @workflow/world-postgres 5.0.5, @workflow/next and @workflow/cli 5.0.6,
# @workflow/utils 5.0.2), exactly. It carries route-agnostic queue delivery
# (vercel/workflow#4835: durable-harness's own queue namespace and route),
# world-local's in-band writer fence across processes (#4834), and
# world-vercel declaring the fence (#4833). Every @workflow/* package is
# overridden too, so one copy of each is installed (eve's and the CLI's
# dependencies included).
catalog:
  eve: 0.83.0
  ai: 7.0.150
  '@ai-sdk/provider': 4.0.33
  # libfx, exactly: 0.0.14, the first stable with durability (libfx/durable-*),
  # what `npm i libfx` installs. Every fx lane, the fx (libfx durable) harness,
  # the CLI check and the examples use this one.
  libfx: 0.0.14
  '@workflow/astro': 5.0.6
  '@workflow/builders': 5.0.6
  '@workflow/cli': 5.0.6
  '@workflow/core': 5.2.3
  '@workflow/errors': 5.0.5
  '@workflow/nest': 5.1.4
  '@workflow/next': 5.0.6
  '@workflow/nitro': 5.0.6
  '@workflow/nuxt': 5.0.6
  '@workflow/rollup': 5.0.6
  '@workflow/serde': 5.0.0
  '@workflow/sveltekit': 5.0.6
  '@workflow/swc-plugin': 5.0.1
  '@workflow/typescript-plugin': 5.0.0
  '@workflow/utils': 5.0.2
  '@workflow/vite': 5.0.6
  '@workflow/web': 5.0.6
  '@workflow/world': 5.0.5
  '@workflow/world-local': 5.1.2
  '@workflow/world-postgres': 5.0.5
  '@workflow/world-vercel': 5.2.3
  'workflow': 5.2.3
overrides:
  '@workflow/astro': 'catalog:'
  '@workflow/builders': 'catalog:'
  '@workflow/cli': 'catalog:'
  '@workflow/core': 'catalog:'
  '@workflow/errors': 'catalog:'
  '@workflow/nest': 'catalog:'
  '@workflow/next': 'catalog:'
  '@workflow/nitro': 'catalog:'
  '@workflow/nuxt': 'catalog:'
  '@workflow/rollup': 'catalog:'
  '@workflow/serde': 'catalog:'
  '@workflow/sveltekit': 'catalog:'
  '@workflow/swc-plugin': 'catalog:'
  '@workflow/typescript-plugin': 'catalog:'
  '@workflow/utils': 'catalog:'
  '@workflow/vite': 'catalog:'
  '@workflow/web': 'catalog:'
  '@workflow/world': 'catalog:'
  '@workflow/world-local': 'catalog:'
  '@workflow/world-postgres': 'catalog:'
  '@workflow/world-vercel': 'catalog:'
  'workflow': 'catalog:'
